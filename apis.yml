name: Standard Cognition
description: 'Standard Cognition (now Standard AI) is a San Francisco company that builds AI-powered
  autonomous checkout and computer-vision technology for physical retail, letting shoppers pick up
  items and walk out without scanning or waiting in line. Founded in 2017 and backed by Initialized
  Capital, it pairs ceiling-mounted cameras with real-time deep-learning models to power cashierless
  stores and, more recently, retail inventory and shopper-behavior analytics. The company runs an
  open-source GitHub organization for its infrastructure tooling but publishes no public developer
  API, SDK, or OpenAPI surface.'
